<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pengaturan — Clinqoo</title>
<meta name="theme-color" content="#f7f4ee">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/icon-32.png">
<link rel="apple-touch-icon" href="/assets/brand/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/app.css?v=3">
<link rel="stylesheet" href="/css/settings.css">
</head>
<body>
<div class="shell" id="shell">
  <main class="main">
    <div class="topbar"><div><h1>Pengaturan</h1><p>Pilih bagian yang mau diubah.</p></div></div>

    <div class="set">
      <div class="set__head"><h2>Akun</h2></div>
      <a class="set__row" href="/app/pengaturan/profil/">
        <span class="set__body"><b>Profil usaha</b><span>Foto, nama usaha, dan email akun</span></span>
        <span class="set__value" id="rowProfil">—</span>
        <svg class="set__chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </a>
      <a class="set__row" href="/app/pengaturan/keamanan/">
        <span class="set__body"><b>Keamanan</b><span>Ganti password akun</span></span>
        <span class="set__value">Password</span>
        <svg class="set__chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </a>
      <a class="set__row" href="/app/pengaturan/sesi/">
        <span class="set__body"><b>Sesi</b><span>Perangkat yang sedang masuk dan keluar akun</span></span>
        <span class="set__value" id="rowSesi">—</span>
        <svg class="set__chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </div>

    <div class="set" style="margin-top:18px">
      <div class="set__head"><h2>Pembayaran</h2></div>
      <a class="set__row" href="/app/pengaturan/toko/">
        <span class="set__body"><b>Link toko</b><span>Alamat publik tempat pembeli membayar nominal bebas</span></span>
        <span class="set__value" id="rowToko">—</span>
        <svg class="set__chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="/js/app-shell.js?v=9"></script>
<script src="/js/pengaturan-hub.js"></script>
</body>
</html>
