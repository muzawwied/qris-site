<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Keamanan — Clinqoo</title>
<meta name="theme-color" content="#f7f4ee">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/icon-32.png">
<link rel="apple-touch-icon" href="/assets/brand/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/app.css?v=3">
<link rel="stylesheet" href="/css/creds.css">
<link rel="stylesheet" href="/css/settings.css">
</head>
<body>
<div class="shell" id="shell">
  <main class="main">
    <a class="back" href="/app/pengaturan/">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      Pengaturan
    </a>
    <div class="topbar"><div><h1>Keamanan</h1><p>Ganti password akun. Sesi lain tetap aktif.</p></div></div>

    <div class="panel panel--narrow">
      <form id="passForm">
        <div class="field"><label for="cur">Password saat ini</label><input id="cur" type="password" autocomplete="current-password" required></div>
        <div class="field"><label for="next">Password baru</label><input id="next" type="password" minlength="8" autocomplete="new-password" required></div>
        <div class="field"><label for="next2">Ulangi password baru</label><input id="next2" type="password" minlength="8" autocomplete="new-password" required></div>
        <div id="passMsg" class="banner" hidden></div>
        <button class="btn btn--sm" type="submit">Perbarui password</button>
      </form>
      <p class="muted" style="font-size:12px;margin:14px 0 0">Minimal 8 karakter. Gunakan kombinasi yang tidak dipakai di layanan lain.</p>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="/js/app-shell.js"></script>
<script src="/js/page-pengaturan-keamanan.js"></script>
</body>
</html>
