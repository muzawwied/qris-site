<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Profil usaha — Clinqoo</title>
<meta name="theme-color" content="#f7f4ee">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/icon-32.png">
<link rel="apple-touch-icon" href="/assets/brand/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/auth.css?v=2">
<style>
  body.onb-body { background: var(--paper); min-height: 100dvh; position: relative; overflow-x: hidden; margin: 0; }
  body.onb-body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(to right, rgba(23,22,15,.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(23,22,15,.045) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse 80% 65% at 50% 38%, #000 30%, transparent 76%);
    mask-image: radial-gradient(ellipse 80% 65% at 50% 38%, #000 30%, transparent 76%);
  }
  body.onb-body::after {
    content: ""; position: fixed; width: 560px; height: 560px; right: -220px; bottom: -260px;
    border-radius: 50%; pointer-events: none; z-index: 0;
    background: radial-gradient(circle,
      transparent 0 112px, rgba(161,101,47,.16) 112px 113.5px,
      transparent 113.5px 166px, rgba(23,22,15,.06) 166px 167px,
      transparent 167px 220px, rgba(161,101,47,.10) 220px 221.5px,
      transparent 221.5px);
  }
  .onb { position: relative; z-index: 1; min-height: 100dvh; display: flex; flex-direction: column; }
  .onb__bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px clamp(20px, 4vw, 46px); }
  .onb__brand { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); }
  .onb__brand img { width: 27px; height: 27px; border-radius: 50%; display: block; }
  .onb__brand span { font-family: var(--serif); font-size: 20px; letter-spacing: -.015em; }
  .onb__note { font-size: 12px; color: var(--muted); }
  .onb__main { flex: 1; display: grid; place-items: start center; padding: 10px 20px 64px; }
  .onb__card { width: 100%; max-width: 520px; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: clamp(24px, 4vw, 38px); box-shadow: 0 1px 2px rgba(23,22,15,.04); }
  .onb__step { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  .onb__card h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(25px, 3.6vw, 33px); line-height: 1.16; letter-spacing: -.02em; margin: 0 0 10px; }
  .onb__card > p.lead { margin: 0 0 26px; font-size: 13.5px; line-height: 1.7; color: var(--muted); }
  .onb__foot { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  .onb__logo { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .onb__avatar { width: 62px; height: 62px; border-radius: 50%; background: #efeae1; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line); font-family: var(--serif); font-size: 22px; color: var(--muted); flex: none; }
  .onb__avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .onb__logo small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .onb__slug { display: flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 3px; overflow: hidden; background: #fff; }
  .onb__slug span { padding: 0 10px; font-size: 12px; color: var(--muted); background: #f3efe8; align-self: stretch; display: flex; align-items: center; border-right: 1px solid var(--line); }
  .onb__slug input { border: 0; flex: 1; padding: 11px 12px; font: inherit; font-size: 14px; background: transparent; outline: none; }
  .onb__mini { margin: 12px 0 0; text-align: center; }
  .onb__back { background: none; border: 0; padding: 4px; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .onb__back:hover { color: var(--ink); }
  @media (max-width: 520px) { .onb__bar { padding: 18px 20px; } }
</style>
</head>
<body class="onb-body">
<header class="onb__bar">
  <a class="onb__brand" href="/"><img src="/assets/brand/icon-48.png" alt=""> <span>Clinqoo</span></a>
  <span class="onb__note">Profil usaha</span>
</header>

<main class="onb__main">
  <form class="onb__card" id="onbForm" novalidate>

    <section class="onb__step-pane" data-pane="name">
      <h1>Nama tokomu.</h1>
      <p class="lead">Nama ini yang tampil di halaman pembayaran pembeli.</p>
      <div class="field">
        <label for="bizName">Nama toko</label>
        <input id="bizName" type="text" maxlength="80" placeholder="Kedai Kopi Senja" autocomplete="organization">
      </div>
      <div id="msg1" class="banner banner--err" hidden></div>
      <button class="btn btn--block" type="button" id="nextName">Lanjut</button>
    </section>

    <section class="onb__step-pane" data-pane="slug" hidden>
      <h1>Link toko.</h1>
      <p class="lead">Alamat pendek untuk membuka halaman tokomu.</p>
      <div class="field">
        <label for="slug">Link</label>
        <div class="onb__slug">
          <span id="hostLabel">/</span>
          <input id="slug" type="text" maxlength="30" placeholder="kedai-senja" autocomplete="off">
        </div>
      </div>
      <div id="msg2" class="banner banner--err" hidden></div>
      <button class="btn btn--block" type="button" id="nextSlug">Lanjut</button>
      <p class="onb__mini"><button type="button" class="onb__back" id="backName">Kembali</button></p>
    </section>

    <section class="onb__step-pane" data-pane="photo" hidden>
      <h1>Foto profil.</h1>
      <p class="lead">Opsional. Dipakai di sidebar dan halaman toko.</p>
      <div class="onb__logo">
        <div class="onb__avatar" id="avatar">F</div>
        <div>
          <button class="btn btn--ghost btn--sm" type="button" id="pickPhoto">Pilih foto</button>
          <small>JPG atau PNG, maksimal sekitar 150 KB.</small>
        </div>
        <input type="file" id="photo" accept="image/png,image/jpeg" hidden>
      </div>
      <div id="msg3" class="banner banner--err" hidden></div>
      <button class="btn btn--block" type="button" id="save">Simpan</button>
      <p class="onb__mini"><button type="button" class="onb__back" id="skipPhoto">Lewati foto</button></p>
    </section>

  </form>
</main>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var logo = '';
  var biz = $('#bizName');
  var slug = $('#slug');

  $('#hostLabel').textContent = location.host + '/';
  $('#avatar').textContent = 'F';

  fetch('/api/auth/me', { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var u = d && d.user;
      if (!u) { location.replace('/masuk/'); return; }
      if (u.onboarded) { location.replace('/app/'); return; }
      if (u.business_name) biz.value = u.business_name;
      if (u.store_slug) { slug.value = u.store_slug; slug.dataset.touched = '1'; }
      if (u.logo) { logo = u.logo; $('#avatar').innerHTML = '<img alt="" src="' + u.logo + '">'; }
    })
    .catch(function () { location.replace('/masuk/'); });

  function show(name) {
    var panes = document.querySelectorAll('.onb__step-pane');
    for (var i = 0; i < panes.length; i++) {
      panes[i].hidden = panes[i].getAttribute('data-pane') !== name;
    }
  }

  biz.addEventListener('input', function () {
    if (!logo) $('#avatar').textContent = (biz.value.trim().charAt(0) || 'F').toUpperCase();
    if (!slug.dataset.touched) {
      slug.value = biz.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30);
    }
  });
  slug.addEventListener('input', function () { slug.dataset.touched = '1'; });

  $('#nextName').addEventListener('click', function () {
    var m = $('#msg1');
    m.hidden = true;
    if (!biz.value.trim()) {
      m.hidden = false;
      m.textContent = 'Nama toko wajib diisi.';
      biz.focus();
      return;
    }
    show('slug');
    slug.focus();
  });

  $('#nextSlug').addEventListener('click', function () {
    var m = $('#msg2');
    m.hidden = true;
    var v = slug.value.trim();
    if (v && v.replace(/[^a-z0-9-]/g, '').length < 3) {
      m.hidden = false;
      m.textContent = 'Link minimal 3 karakter.';
      slug.focus();
      return;
    }
    show('photo');
  });

  $('#backName').addEventListener('click', function () { show('name'); });
  $('#pickPhoto').addEventListener('click', function () { $('#photo').click(); });
  $('#photo').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var size = 256;
        var c = document.createElement('canvas');
        c.width = size; c.height = size;
        var ctx = c.getContext('2d');
        var s = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        logo = c.toDataURL('image/jpeg', 0.85);
        $('#avatar').innerHTML = '<img alt="" src="' + logo + '">';
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  });

  function submit(withPhoto) {
    var m = $('#msg3');
    var btn = $('#save');
    m.hidden = true;
    var payload = { business_name: biz.value.trim(), onboarded: true };
    var sl = slug.value.trim();
    if (sl) payload.store_slug = sl;
    if (withPhoto && logo) payload.logo = logo;

    btn.disabled = true;
    btn.textContent = 'Menyimpan…';
    fetch('/api/me/profile', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.d.error || 'Gagal menyimpan.');
        location.replace('/app/');
      })
      .catch(function (err) {
        m.hidden = false;
        m.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Simpan';
      });
  }

  $('#save').addEventListener('click', function () { submit(true); });
  $('#skipPhoto').addEventListener('click', function () { submit(false); });
})();
</script>
</body>
</html>
